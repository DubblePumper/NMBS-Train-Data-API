services:
  nmbs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nmbs-train-data-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 25580
      DATA_DIR: /app/data
      COOKIES_FILE: /app/data/cookies.json
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
    ports:
      - "25580:25580"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:25580/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s